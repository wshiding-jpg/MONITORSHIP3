<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07121f">
  <title>航運三雄｜市場監測儀表板</title>
  <style>
    :root{--bg:#07121f;--panel:#0d1c2d;--panel2:#11253a;--line:#203c55;--text:#edf6ff;--muted:#91a9bd;--cyan:#31d2f2;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--blue:#60a5fa}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 75% -10%,#123c55 0,transparent 32%),linear-gradient(180deg,#07121f,#081622 70%);color:var(--text);font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}
    .wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:30px 0 54px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.2em}.title{font-size:clamp(28px,5vw,50px);line-height:1.05;margin:8px 0}.subtitle{color:var(--muted);margin:0;max-width:720px;line-height:1.7}.stamp{text-align:right;color:var(--muted);font-size:13px;white-space:nowrap}.live{display:inline-flex;align-items:center;gap:7px;color:#b9f7df;margin-bottom:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
    .alert{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px 20px;border:1px solid #7d3042;background:linear-gradient(100deg,rgba(127,29,50,.5),rgba(22,33,49,.85));border-radius:16px;margin-bottom:18px}.alertIcon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#9f2440;font-size:22px}.alert h2{font-size:17px;margin:0 0 5px}.alert p{color:#f1b8c3;margin:0;line-height:1.55}.grade{font-size:28px;font-weight:900;color:var(--amber);text-align:center}.grade small{display:block;color:var(--muted);font-size:11px;font-weight:600}
    .grid{display:grid;gap:16px}.stocks{grid-template-columns:repeat(3,1fr);margin-bottom:16px}.card,.section{background:linear-gradient(145deg,rgba(17,37,58,.96),rgba(10,26,42,.96));border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.16)}.stock{padding:20px;position:relative;overflow:hidden}.stock:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;right:-45px;top:-50px;background:color-mix(in srgb,var(--accent),transparent 82%)}.stockHead{display:flex;justify-content:space-between;align-items:start}.ticker{color:var(--muted);font-size:12px;letter-spacing:.1em}.company{font-size:22px;font-weight:800;margin-top:2px}.score{color:var(--accent);font-weight:900;font-size:26px}.score small{font-size:11px;color:var(--muted)}.price{font-size:36px;font-weight:900;margin:22px 0 2px}.change{font-weight:800}.negative{color:var(--green)}.positive{color:var(--red)}.flat{color:var(--muted)}.range{height:5px;border-radius:4px;background:#203448;margin:17px 0;overflow:hidden}.range i{display:block;height:100%;background:var(--accent);border-radius:4px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:9px 5px;border-top:1px solid var(--line)}.metric b{display:block;font-size:14px;margin-top:4px}.metric span{font-size:10px;color:var(--muted)}.driver{margin:14px 0 0;color:#b9cddd;font-size:13px;line-height:1.55}
    .row{grid-template-columns:1.15fr .85fr;margin-bottom:16px}.section{padding:20px}.section h2{font-size:17px;margin:0 0 16px;display:flex;align-items:center;gap:9px}.section h2:before{content:"";width:4px;height:18px;border-radius:2px;background:var(--cyan)}.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rate{background:#091827;border:1px solid var(--line);border-radius:12px;padding:14px}.rate span{color:var(--muted);font-size:11px}.rate b{font-size:24px;display:block;margin:7px 0}.rate em{font-style:normal;font-size:12px}.ports{display:grid;gap:12px}.portTop{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;background:#1b3043;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{height:100%;display:block;border-radius:9px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
    .signals{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.signal{padding:17px}.signal span{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.signal b{font-size:14px;line-height:1.5}.hypotheses{display:grid;gap:10px}.hypothesis{display:grid;grid-template-columns:130px 1fr;gap:14px;padding:15px;background:#091827;border:1px solid var(--line);border-radius:12px}.tag{height:max-content;padding:7px 9px;border-radius:8px;text-align:center;color:#081622;background:var(--cyan);font-size:11px;font-weight:900}.tag.alt{background:var(--amber)}.hypothesis b{display:block;margin-bottom:7px}.hypothesis p{margin:4px 0;color:var(--muted);font-size:12px;line-height:1.6}.bottom{grid-template-columns:1fr 1fr}.list{margin:0;padding-left:20px;color:#c8d9e6}.list li{padding:6px 0;line-height:1.6}.sourceList{display:grid;gap:8px}.sourceList a{color:#b8d9ef;text-decoration:none;font-size:12px;padding:8px 10px;background:#091827;border-radius:8px}.sourceList a:hover{color:var(--cyan)}footer{text-align:center;color:#607b91;font-size:11px;margin-top:25px}.error{padding:30px;border:1px solid #7d3042;background:#331724;border-radius:15px;color:#ffd6de}
    @media(max-width:850px){.stocks,.signals{grid-template-columns:1fr 1fr}.row,.bottom{grid-template-columns:1fr}.top{display:block}.stamp{text-align:left;margin-top:15px}.rates{grid-template-columns:1fr 1fr}}
    @media(max-width:570px){.wrap{width:min(100% - 20px,1180px);padding-top:20px}.stocks,.signals,.rates{grid-template-columns:1fr}.alert{grid-template-columns:auto 1fr}.grade{grid-column:1/-1;text-align:left}.hypothesis{grid-template-columns:1fr}.tag{width:max-content}.metrics{gap:4px}.price{font-size:32px}}
  </style>
</head>
<body><main class="wrap" id="app"><div class="error">正在讀取最新航運資料……</div></main>
<script>
const names={"2603":"長榮","2609":"陽明","2615":"萬海"};
const accents={"2603":"#31d2f2","2609":"#fbbf24","2615":"#a78bfa"};
const companyKeys={"2603":"evergreen","2609":"yang_ming","2615":"wan_hai"};
const fmt=n=>n==null?"—":Number(n).toLocaleString("zh-TW");
const cls=n=>n>0?"positive":n<0?"negative":"flat";
const signed=n=>n==null?"—":`${n>0?"+":""}${fmt(n)}`;
const pct=n=>n==null?"—":`${n>0?"+":""}${n}%`;
const esc=s=>String(s??"—").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function stockCard(code,s,d){const c=d.companies[companyKeys[code]]||{};const pos=s.high===s.low?50:Math.max(4,Math.min(100,(s.close_or_last-s.low)/(s.high-s.low)*100));return `<article class="card stock" style="--accent:${accents[code]}"><div class="stockHead"><div><div class="ticker">${code} · TWSE</div><div class="company">${names[code]}</div></div><div class="score">${fmt(c.score)}<small>/100</small></div></div><div class="price">${fmt(s.close_or_last)}</div><div class="change ${cls(s.change_pct)}">${pct(s.change_pct)}</div><div class="range"><i style="width:${pos}%"></i></div><div class="metrics"><div class="metric"><span>成交量</span><b>${fmt(s.volume)} 張</b></div><div class="metric"><span>外資</span><b class="${cls(s.foreign_net)}">${signed(s.foreign_net)}</b></div><div class="metric"><span>投信</span><b class="${cls(s.investment_trust_net)}">${signed(s.investment_trust_net)}</b></div></div><p class="driver"><b>${esc(c.short_term)}</b><br>${esc(c.key_driver)}</p></article>`}
function render(d){const q=d.data_quality_grade||"—";const ports=[["新加坡",d.signals.singapore_wait_hours],["北亞",d.signals.north_asia_wait_hours],["北歐",d.signals.north_europe_wait_hours]];document.getElementById("app").innerHTML=`
<header class="top"><div><div class="eyebrow">CONTAINER SHIPPING INTELLIGENCE</div><h1 class="title">航運三雄市場監測</h1><p class="subtitle">將股價、法人、運價、港口等待、航道與燃油成本放在同一張決策畫面；清楚區分證據、推論與反證條件。</p></div><div class="stamp"><div class="live"><i class="dot"></i>資料已完成更新</div><br>資料截至 ${esc(d.data_cutoff?.replace("T"," ").slice(0,16))}<br>${d.run_type==="morning"?"盤前早報":"盤後晚報"}</div></header>
<section class="alert"><div class="alertIcon">⚠</div><div><h2>目前核心判讀</h2><p>${esc(d.summary)}</p></div><div class="grade">${esc(q)}<small>資料品質</small></div></section>
<section class="grid stocks">${Object.entries(d.stocks).map(([c,s])=>stockCard(c,s,d)).join("")}</section>
<section class="grid row"><div class="section"><h2>三大運價指數</h2><div class="rates">${[["SCFI",d.signals.scfi,d.signals.scfi_change_pct],["CCFI",d.signals.ccfi,d.signals.ccfi_change_pct],["WCI",d.signals.wci,d.signals.wci_change_pct]].map(x=>`<div class="rate"><span>${x[0]}</span><b>${fmt(x[1])}</b><em class="${cls(x[2])}">${pct(x[2])}</em></div>`).join("")}</div></div><div class="section"><h2>主要港口等待時間</h2><div class="ports">${ports.map(([n,v])=>`<div><div class="portTop"><span>${n}</span><b>${v==null?"資料待補":v+" 小時"}</b></div><div class="bar"><i style="width:${v==null?0:Math.min(100,v/48*100)}%"></i></div></div>`).join("")}</div></div></section>
<section class="grid signals">${[["荷姆茲船流",d.signals.hormuz],["空班",d.signals.blank_sailings],["繞航判讀",d.signals.rerouting],["燃油／戰險",d.signals.fuel+"；"+d.signals.war_risk_insurance]].map(x=>`<div class="card signal"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join("")}</section>
<section class="section" style="margin-bottom:16px"><h2>情境假說與反證條件</h2><div class="hypotheses">${d.hypotheses.map((h,i)=>`<div class="hypothesis"><div class="tag ${i?"alt":""}">${esc(h.state)}</div><div><b>${esc(h.text)}</b><p>支持證據｜${h.evidence.map(esc).join("、")}</p><p>反證條件｜${esc(h.falsification)}</p></div></div>`).join("")}</div></section>
<section class="grid bottom"><div class="section"><h2>預測與校準</h2><ul class="list"><li>${esc(d.forecast.direction)}</li><li>信心：${esc(d.forecast.confidence)}</li><li>前次檢驗：${esc(d.forecast_review.result)}；${esc(d.forecast_review.error_type)}</li><li>${esc(d.forecast_review.lesson)}</li></ul></div><div class="section"><h2>資料來源</h2><div class="sourceList">${d.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)} · ${esc(s.published_at)}</a>`).join("")}</div></div></section>
<footer>本儀表板為研究與情境判讀工具，不構成投資建議。資料缺口以「—／待補」顯示，不以推測值補齊。</footer>`}
fetch("./data/latest.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(render).catch(e=>{document.getElementById("app").innerHTML=`<div class="error"><b>資料暫時無法載入</b><br>請稍後重新整理。錯誤代碼：${esc(e.message)}</div>`})
</script></body></html>
